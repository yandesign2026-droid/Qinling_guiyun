<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>秦岭归云 · N01–N02 垂直切片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#14120f;display:flex;align-items:center;justify-content:center;min-height:100vh;
     font-family:-apple-system,"PingFang SC","Songti SC",serif;overflow:hidden}
#stage{position:relative}
#phone{width:390px;height:844px;background:#0a0908;position:relative;overflow:hidden;
       border-radius:24px;box-shadow:0 0 0 8px #2a2622,0 30px 80px rgba(0,0,0,.8)}

/* 状态栏 */
#bar{position:absolute;top:0;left:0;right:0;height:44px;z-index:30;
     display:flex;align-items:center;justify-content:space-between;padding:0 18px;
     font-size:11px;color:#c8bda8;letter-spacing:.5px;background:linear-gradient(#000a,transparent)}
#sig{display:flex;align-items:flex-end;gap:1.5px;height:10px}
#sig i{width:2.5px;background:#c8bda8;border-radius:1px}
#sig i.off{background:#4a443a}

/* 场景 */
#scene{position:absolute;top:0;left:0;right:0;height:490px;background:#000;overflow:hidden}
#scene img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;
           transition:opacity .8s ease;filter:saturate(.82) contrast(1.06)}
#scene img.on{opacity:1}
#vig{position:absolute;inset:0;pointer-events:none;
     background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.72) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay}

/* 环境叙事句：自底向上浮出，字号小于台词 */
#env{position:absolute;left:26px;right:26px;bottom:560px;text-align:center;z-index:20;
     color:#e8dcc4;font-size:13.5px;line-height:2;letter-spacing:1.5px;opacity:0;
     transform:translateY(14px);transition:all 1.1s ease;text-shadow:0 2px 12px #000}
#env.on{opacity:.92;transform:translateY(0)}

/* 对白区 */
#talk{position:absolute;top:490px;bottom:0;left:0;right:0;background:#0f0d0b;
      border-top:1px solid #2a2620;padding:22px 26px 0}
#who{font-size:12px;color:#8a2b2b;letter-spacing:3px;margin-bottom:10px;min-height:16px}
#who.boss{color:#b8352b}#who.env{color:#5a6a58}#who.me{color:#7a8a98}
#line{font-size:16.5px;line-height:1.95;color:#ddd2bc;min-height:98px;letter-spacing:.6px}
#line .cur{opacity:.35}
#hint{position:absolute;bottom:16px;right:24px;font-size:11px;color:#6a6255;letter-spacing:1px}

/* UI 层（地图 / 锁屏 / 支付） */
#ui{position:absolute;top:490px;bottom:0;left:0;right:0;background:#0f0d0b;
    padding:24px 26px;display:none;z-index:40;flex-direction:column}
#ui.on{display:flex}

/* 地图 */
.mapbox{background:#1a1c1e;border-radius:10px;padding:12px;margin-bottom:14px;
        border:1px solid #2c2f31}
.maptop{background:#232628;border-radius:6px;padding:8px 12px;color:#8a939b;font-size:12px;margin-bottom:10px}
.maparea{height:150px;background:#141618;border-radius:6px;position:relative;overflow:hidden;
         background-image:linear-gradient(#1e2124 1px,transparent 1px),linear-gradient(90deg,#1e2124 1px,transparent 1px);
         background-size:26px 26px}
#dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#3a8fd8;
     box-shadow:0 0 10px #3a8fd8;transition:all .9s ease}
.mapfoot{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:#6a7278}

/* 锁屏横幅 */
.banner{background:rgba(28,30,32,.94);border-radius:14px;padding:14px 16px;margin-top:8px;
        box-shadow:0 8px 30px rgba(0,0,0,.6)}
.banner .t{font-size:13px;color:#e8e2d6;margin-bottom:3px}
.banner .s{font-size:11px;color:#8a939b}

/* 支付 */
.pay{flex:1;display:flex;flex-direction:column}
.payhead{color:#8a939b;font-size:11px;letter-spacing:2px;margin-bottom:6px}
.payee{font-size:19px;color:#ddd2bc;margin-bottom:20px}
#amt{font-size:40px;color:#ddd2bc;letter-spacing:1px;border-bottom:1px solid #3a3630;
     padding-bottom:10px;min-height:56px}
#amt .ph{color:#4a443a}
.paynote{font-size:11px;color:#6a6255;margin:8px 0 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#22201c;
      margin-top:auto;margin-left:-26px;margin-right:-26px}
.keys button{background:#15130f;border:0;color:#ddd2bc;font-size:21px;padding:15px 0;
             font-family:inherit;cursor:pointer}
.keys button:active{background:#2a2620}
#okbtn{margin-top:12px;background:#3a3630;border:0;color:#8a8172;padding:13px;border-radius:8px;
       font-size:14px;letter-spacing:3px;font-family:inherit;cursor:pointer}
#okbtn.on{background:#8a2b2b;color:#fff}

/* 标题卡 */
#title{position:absolute;inset:0;background:#0a0908;z-index:60;display:none;
       flex-direction:column;align-items:center;justify-content:center}
#title.on{display:flex}
#title h1{font-size:38px;letter-spacing:14px;color:#ddd2bc;font-weight:400;margin-left:14px}
#title .sub{margin-top:20px;font-size:12px;color:#6a6255;letter-spacing:6px}

/* 开场 */
#start{position:absolute;inset:0;z-index:80;background:#0a0908;display:flex;
       flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#start .b{font-size:13px;color:#8a8172;letter-spacing:8px}
#start .s{margin-top:14px;font-size:11px;color:#4a443a;letter-spacing:2px}
#log{position:absolute;left:14px;bottom:14px;font-size:10px;color:#3a3630;z-index:70;
     font-family:monospace;line-height:1.7}
</style>
</head>
<body>
<div id="stage">
<div id="phone">
  <div id="bar"><span id="clock">20:41</span>
    <span id="sig"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px" class="off"></i><i style="height:9px" class="off"></i></span>
  </div>

  <div id="scene">
    <img id="bg" alt="">
    <div id="vig"></div>
    <canvas id="grain"></canvas>
  </div>

  <div id="env"></div>

  <div id="talk">
    <div id="who"></div>
    <div id="line"></div>
  </div>
  <div id="hint">点击继续 ▸</div>

  <div id="ui"></div>

  <div id="title">
    <h1>秦岭归云</h1>
    <div class="sub">第一夜 · 入村</div>
    <div class="sub" style="margin-top:8px">D A Y &nbsp; 0</div>
  </div>

  <div id="start">
    <div class="b">秦 岭 归 云</div>
    <div class="s">N01–N02 垂直切片 · 点击开始（需开声音）</div>
  </div>
  <div id="log"></div>
</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   秦岭归云 · N01–N02 可跑原型
   ─ 逻辑层按 Ink 的 knot / stitch 组织，变量集中在 S，后续可直接迁 .ink
   ─ 台词取自 台词库 v3（小说原文版）
   ─ 配音取自 配音_v3/，音乐取自 音频/音乐/
   ═══════════════════════════════════════════════════════════════ */
const P = { img:'../场景图_N01-N04/', vo:'../配音_v3/', mu:'../音频/音乐/' };

// ── 全局状态（对应 Ink 的 VAR）──────────────────────────────────
const S = { day:0, paid:0, E1:false, st_boss:'正常', attempt:0 };

// ── 节点表 ──────────────────────────────────────────────────────
const NODES = {
'N01.road':{
  bg:'N01_雾中路牌', amb:'AMB01_山雾',
  steps:[
    {e:'秦岭的雾，是活的。'},
    {ui:'map'},
    {e:'空气里有一股陈腐的甜腥味，像朽烂的木头混着不知名的野花。'},
    {ui:'sim'},
  ], next:'N01.gate'},

'N01.gate':{
  bg:'N01_院内背影', amb:'AMB01_山雾',
  steps:[
    {e:'那红色在浓雾里晕开，像一滴血落在宣纸上。'},
    {w:'孙明远', c:'me', t:'后生，住店不？', v:'Q107_孙明远'},
    {w:'孙明远', c:'me', t:'有，就一家。顺石板路走到头，看见挂红灯笼的便是。', v:'Q108_孙明远'},
    {w:'孙明远', c:'me', t:'天黑了别出来走动，这地方……不干净。', v:'Q109_孙明远'},
    {e:'他起身，佝偻着背，慢悠悠消失在雾里，脚步轻得几乎没有。'},
  ], next:'N01.title'},

'N01.title':{ title:true, next:'N02.counter' },

'N02.counter':{
  bg:'N02_堂屋柜台', amb:'AMB02_客栈夜', day:1,
  steps:[
    {w:'沈怀谷', c:'me', t:'嗯，还有房间吗？', v:'Q130_沈怀谷'},
    {w:'老板娘', c:'boss', t:'有。一晚两百，包三餐。先交一周的。', v:'Q20_老板娘'},
    {ui:'pay'},
  ], next:'N02.after'},

'N02.after':{
  bg:'N02_堂屋柜台', amb:'AMB02_客栈夜',
  steps:[
    {w:'老板娘', c:'boss', t:'晚饭六点，楼下堂屋。', v:'Q21_老板娘'},
    {w:'老板娘', c:'boss', t:'这地方偏，没什么好玩的。不过后山有个老庙。', v:'Q22_老板娘'},
    {w:'老板娘', c:'boss', t:'别乱走。尤其是晚上。', v:'Q23_老板娘'},
    {e:'她收钱的时候，指甲是暗红的。和她的旗袍一个颜色。'},
  ], next:'N02.room'},

'N02.room':{
  bg:'N02_客房全景', amb:'AMB02_客栈夜',
  steps:[
    {e:'床是新铺的。被子叠得很紧，四角对齐，像没打算让人躺。'},
    {w:'', c:'', t:'—— N01 / N02 切片结束 ——', v:null},
  ], next:null}
};

// ── 音频 ────────────────────────────────────────────────────────
let ambA=new Audio(), ambB=new Audio(), voA=new Audio();
ambA.loop=ambB.loop=true; ambA.volume=ambB.volume=0;

function setAmb(name){
  const url = P.mu + name + '.wav';
  if (ambA.src.includes(name)) return;
  const incoming = ambA.volume>0.01 ? ambB : ambA;
  const outgoing = incoming===ambA ? ambB : ambA;
  // 交叉淡入 2 秒
  const t0=performance.now();
  incoming.src = url; incoming.volume=0;
  incoming.play().catch(()=>{});
  const step=()=>{
    const k=Math.min(1,(performance.now()-t0)/2000);
    incoming.volume = 0.55*k;
    outgoing.volume = 0.55*(1-k);
    if(k<1) requestAnimationFrame(step); else { try{outgoing.pause()}catch(e){} }
  };
  step();
}
function playVO(id){
  if(!id) return;
  voA.src = P.vo + id + '.wav';
  voA.volume = 0.95;
  voA.play().catch(()=>{});
}

// ── 演出 ────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const bgEl=$('bg'), envEl=$('env'), whoEl=$('who'), lineEl=$('line'), uiEl=$('ui');
let typing=null, cur=null, si=0, waiting=false;

function log(s){ $('log').innerHTML += s+'<br>'; if($('log').childNodes.length>6) $('log').removeChild($('log').firstChild); }

function setBG(name){
  if(!name) return;
  bgEl.classList.remove('on');
  setTimeout(()=>{ bgEl.src = P.img + name + '.png'; bgEl.classList.add('on'); }, 260);
}

function showEnv(t){
  envEl.textContent = t; envEl.classList.add('on');
  return new Promise(r=>setTimeout(()=>{ envEl.classList.remove('on'); setTimeout(r,500); }, 2600));
}

function typeOut(text){
  return new Promise(r=>{
    lineEl.innerHTML=''; let i=0;
    const tick=()=>{
      if(i>=text.length){ r(); return; }
      lineEl.innerHTML = text.slice(0,i+1);
      i++;
      typing = setTimeout(tick, 42);
    };
    tick();
  });
}

async function runStep(st){
  if(st.e){ return showEnv(st.e); }
  if(st.ui){ return showUI(st.ui); }
  whoEl.textContent = st.w || ''; whoEl.className = st.c||'';
  playVO(st.v);
  await typeOut(st.t);
  await waitTap();
}

function waitTap(){
  waiting = true; $('hint').style.opacity=1;
  return new Promise(r=>{ cur = r; });
}

async function runNode(key){
  if(!key) return;
  const n = NODES[key];
  log('▶ '+key);
  if(n.day!==undefined){ S.day=n.day; log('   day='+S.day); }
  if(n.amb) setAmb(n.amb);
  if(n.title){ await showTitle(); return runNode(n.next); }
  setBG(n.bg);
  await new Promise(r=>setTimeout(r,700));
  for(const st of n.steps){ await runStep(st); }
  return runNode(n.next);
}

function showTitle(){
  return new Promise(r=>{
    $('title').classList.add('on');
    setTimeout(()=>{ $('title').classList.remove('on'); r(); }, 3200);
  });
}

// ── UI 层 ───────────────────────────────────────────────────────
function showUI(kind){
  uiEl.innerHTML=''; uiEl.classList.add('on');
  $('hint').style.opacity=0;
  if(kind==='map') return uiMap();
  if(kind==='sim') return uiSim();
  if(kind==='pay') return uiPay();
}

function uiMap(){
  uiEl.innerHTML = `
    <div class="mapbox">
      <div class="maptop">归云村</div>
      <div class="maparea"><div id="dot" style="left:40%;top:60%"></div></div>
      <div class="mapfoot"><span>定位信号弱 · 正在离线推算</span><span>3.2 km</span></div>
    </div>
    <div style="font-size:12px;color:#6a6255;text-align:center;margin-top:10px">点击继续 ▸</div>`;
  const d=$('dot');
  setTimeout(()=>{ d.style.left='52%'; d.style.top='42%'; },600);
  setTimeout(()=>{ d.style.left='63%'; d.style.top='30%'; },1500);
  setTimeout(()=>{ d.style.filter='blur(1px)'; d.style.left='78%'; d.style.top='18%'; },2400);
  return waitTap().then(()=>{ uiEl.classList.remove('on'); });
}

function uiSim(){
  uiEl.innerHTML = `
    <div style="flex:1"></div>
    <div class="banner"><div class="t">SIM 卡服务受限</div><div class="s">归属地未知</div></div>
    <div style="flex:1"></div>
    <div style="font-size:12px;color:#6a6255;text-align:center">点击继续 ▸</div>`;
  return waitTap().then(()=>{ uiEl.classList.remove('on'); });
}

function uiPay(){
  let buf='';
  uiEl.innerHTML = `
    <div class="pay">
      <div class="payhead">付 款</div>
      <div class="payee">归云居</div>
      <div id="amt"><span class="ph">¥ ___</span></div>
      <div class="paynote">备注　房费</div>
      <div class="keys">
        ${[1,2,3,4,5,6,7,8,9,'清空',0,'←'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}
      </div>
      <button id="okbtn">确 认 支 付</button>
    </div>`;
  const amt=$('amt'), ok=$('okbtn');
  const draw=()=>{ amt.innerHTML = buf ? '¥ '+buf : '<span class="ph">¥ ___</span>';
                   ok.classList.toggle('on', buf.length>0); };
  uiEl.querySelectorAll('.keys button').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='清空') buf='';
      else if(k==='←') buf=buf.slice(0,-1);
      else if(buf.length<6) buf+=k;
      draw();
    };
  });
  return new Promise(resolve=>{
    ok.onclick=()=>{
      if(!buf) return;
      const v=parseInt(buf,10);
      log('   paid='+v);
      if(v===200 || v===1400){
        S.paid=v;
        uiEl.innerHTML=`<div class="pay" style="justify-content:center;align-items:center">
          <div style="font-size:34px;color:#7ab87a">✓</div>
          <div style="margin-top:14px;font-size:15px;color:#ddd2bc">支付成功</div>
          <div style="margin-top:6px;font-size:12px;color:#8a8172">¥${v}.00 · 归云居</div>
          <div style="margin-top:26px;font-size:12px;color:#6a6255">点击继续 ▸</div></div>`;
        waitTap().then(()=>{ uiEl.classList.remove('on'); resolve(); });
      } else {
        S.attempt++;
        uiEl.querySelector('.paynote').textContent='山里不收这个数。';
        uiEl.querySelector('.paynote').style.color='#b8352b';
        buf=''; draw();
        setTimeout(()=>{ uiEl.querySelector('.paynote').textContent='备注　房费';
                         uiEl.querySelector('.paynote').style.color='#6a6255'; },1600);
      }
    };
  });
}

// ── 噪点 ────────────────────────────────────────────────────────
(function(){
  const c=$('grain'), w=c.width=390, h=c.height=490, x=c.getContext('2d');
  const d=x.createImageData(w,h);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255;
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  x.putImageData(d,0,0);
})();

// ── 启动 ────────────────────────────────────────────────────────
$('start').onclick = ()=>{
  $('start').style.display='none';
  log('▶ start');
  runNode('N01.road');
};
document.addEventListener('click', e=>{
  if(waiting && !e.target.closest('#ui')){ waiting=false; $('hint').style.opacity=0; if(cur){const r=cur;cur=null;r();} }
});
document.addEventListener('keydown', e=>{
  if((e.code==='Space'||e.code==='Enter') && waiting){ waiting=false; if(cur){const r=cur;cur=null;r();} }
});
</script>
</body>
</html>
